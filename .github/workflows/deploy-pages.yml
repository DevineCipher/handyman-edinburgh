name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p site
          if [ -d dist/client ]; then
            cp -R dist/client/. site/
          elif [ -d dist ]; then
            cp -R dist/. site/
          elif [ -d .output/public ]; then
            cp -R .output/public/. site/
          else
            echo "Could not find a static build folder"
            find . -maxdepth 3 -type d
            exit 1
          fi
          if [ -f site/index.html ]; then
            cp site/index.html site/404.html
          elif [ -f site/_shell.html ]; then
            cp site/_shell.html site/index.html
            cp site/_shell.html site/404.html
          else
            echo "No index.html or _shell.html in build output"
            ls -la site
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
